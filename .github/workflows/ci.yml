name: Validate and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Check application
        run: bun run check
      - name: Check migrations
        run: bun run db:check
      - name: Run dashboard end-to-end tests
        run: bun run test:e2e
      - name: Build production artifacts
        run: bun run build

  publish:
    name: publish-container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build smoke-test image
        run: >-
          docker build
          --build-arg GIT_REVISION=${{ github.sha }}
          --tag gig-finder-smoke:${{ github.sha }}
          .
      - name: Smoke-test production image
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -eu
          context_root="${RUNNER_TEMP}/gig-finder-smoke"
          mkdir -p "${context_root}/profile" "${context_root}/codex"
          cp src/web/test-fixtures/candidate-profile.json "${context_root}/profile/candidate-profile.json"
          chmod -R a+rwX "${context_root}"
          docker run --rm \
            -e GIG_FINDER_CONTEXT_ROOT=/var/lib/gig-finder \
            -v "${context_root}:/var/lib/gig-finder" \
            gig-finder-smoke:${REVISION} \
            bun dist/server/maintenance.js initialize
          container_id="$(docker run --detach --rm \
            -e GIG_FINDER_CONTEXT_ROOT=/var/lib/gig-finder \
            -e CODEX_HOME=/run/codex \
            -v "${context_root}:/var/lib/gig-finder" \
            -v "${context_root}/codex:/run/codex:ro" \
            -p 127.0.0.1:3001:3001 \
            gig-finder-smoke:${REVISION})"
          trap 'docker stop "${container_id}" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/healthz | grep -q "${REVISION}" \
              && curl --fail --silent http://127.0.0.1:3001/ | grep -q "GigFinder"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "${container_id}"
          exit 1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GIT_REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
