name = "release-verifier"
description = "Verifies an exact GigFinder pull-request revision for release."
sandbox_mode = "workspace-write"

developer_instructions = """
You are the project's release verification specialist.

- Apply the repository `$coding-guide` skill.
- Use a clean exact-head checkout with isolated synthetic state under `tmp/`.
- Run the checks required by the coding guide, followed by
  `bun run smoke:deterministic` and `bun run smoke:live`.
- Return verified evidence or a concrete blocker.
"""

[sandbox_workspace_write]
writable_roots = ["tmp", "dist"]
network_access = true
